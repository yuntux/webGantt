<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webGantt - GanttProject in the Browser</title>
    <style>
        /* CSS Variables for Light/Dark Mode (UI-004) */
        :root {
            --bg-color: #f4f5f7;
            --surface-color: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --toolbar-bg: #e1e4e8;
            --primary-color: #0366d6;
            --hover-color: #f0f0f0;
        }

        [data-theme="dark"] {
            --bg-color: #1e1e1e;
            --surface-color: #252526;
            --text-color: #cccccc;
            --border-color: #3e3e42;
            --toolbar-bg: #333333;
            --primary-color: #3794ff;
            --hover-color: #2a2d2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Toolbar (UI-003) */
        #toolbar {
            height: 48px;
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        button {
            padding: 6px 12px;
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: var(--hover-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: var(--bg-color);
            color: #888;
        }

        button.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background-color: #0255b3; /* Slightly darker primary */
        }

        /* Main Split View Layout (UI-001) */
        #main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Pane: WBS Data Table */
        #left-pane {
            width: 400px;
            min-width: 150px;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
        }

        /* Splitter (T038) */
        #splitter {
            width: 4px;
            cursor: col-resize;
            background-color: var(--border-color);
            flex-shrink: 0;
            z-index: 10;
            transition: background-color 0.2s;
        }
        #splitter:hover, #splitter:active {
            background-color: var(--primary-color);
        }

        /* Right Pane: Gantt Chart Timeline */
        #right-pane {
            flex: 1;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            overflow: auto;
        }

        .pane-header {
            height: 32px;
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .pane-content {
            flex: 1;
            overflow: auto;
            padding: 0; /* Zéro padding pour garantir l'alignement parfait des lignes */
        }
    </style>
</head>
<body>
    <!-- Top Toolbar -->
    <div id="toolbar">
        <button id="btn-open" class="primary">Ouvrir un projet (.gan)</button>
        <button id="btn-save" style="display: none;">Enregistrer</button>
        <button id="btn-download">Télécharger</button>
        <button id="btn-add-task">Ajouter Tâche</button>
        <button id="btn-add-milestone">Ajouter Jalon</button>
        <button id="btn-resources">Ressources</button>
        <button id="btn-baselines">Lignes de base</button>
        <div style="flex: 1;"></div>
        <button id="btn-theme-toggle">Mode Sombre</button>
    </div>

    <!-- T017 : Dialog for resources -->
    <dialog id="resource-modal" style="margin: auto; padding: 16px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--surface-color); color: var(--text-color); min-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h3>Pool de Ressources</h3>
        <ul id="resource-list" style="margin: 12px 0; padding-left: 20px; max-height: 200px; overflow-y: auto;"></ul>
        <div style="display:flex; gap: 8px;">
            <input type="text" id="new-resource-name" placeholder="Nom de la ressource" style="flex:1; padding: 4px;" />
            <button id="btn-add-resource" class="primary">Ajouter</button>
        </div>
        <br><br>
        <button id="btn-close-resources">Fermer</button>
    </dialog>

    <!-- T018 : Dialog for assigning resources -->
    <dialog id="assign-modal" style="margin: auto; padding: 16px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--surface-color); color: var(--text-color); min-width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h3>Affecter une ressource</h3>
        <p style="margin: 8px 0; font-size: 13px;">Sélectionnez une ressource pour la tâche :</p>
        <select id="assign-resource-select" style="width: 100%; padding: 4px; margin-bottom: 12px;"></select>
        <div style="display:flex; gap: 8px; justify-content: flex-end;">
            <button id="btn-cancel-assign">Annuler</button>
            <button id="btn-confirm-assign" class="primary">Affecter</button>
        </div>
    </dialog>

    <!-- T028 : Dialog for baselines -->
    <dialog id="baseline-modal" style="margin: auto; padding: 16px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--surface-color); color: var(--text-color); min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h3>Lignes de base (Baselines)</h3>
        <p style="margin: 8px 0; font-size: 13px;">Ligne de base active sur le Gantt :</p>
        <select id="active-baseline-select" style="width: 100%; padding: 4px; margin-bottom: 12px;"></select>
        
        <h4>Empreintes existantes :</h4>
        <ul id="baseline-list" style="margin: 8px 0; padding-left: 0; list-style-type: none; max-height: 150px; overflow-y: auto;"></ul>
        
        <div style="display:flex; gap: 8px; margin-top: 12px;">
            <input type="text" id="new-baseline-name" placeholder="Nom de la nouvelle empreinte" style="flex:1; padding: 4px;" />
            <button id="btn-create-baseline" class="primary">Créer</button>
        </div>
        <br><br>
        <div style="text-align: right;">
            <button id="btn-close-baselines">Fermer</button>
        </div>
    </dialog>

    <!-- Main Application Split View -->
    <div id="main-container">
        <!-- Left Pane: Data Table -->
        <div id="left-pane">
            <div class="pane-header" style="justify-content: space-between;">
                <span>Tâches (WBS)</span>
                <div id="wbs-toolbar" style="display:flex; gap:4px;">
                    <button id="btn-outdent" title="Désindenter" style="padding:0 4px;" disabled>←</button>
                    <button id="btn-indent" title="Indenter" style="padding:0 4px;" disabled>→</button>
                    <button id="btn-move-up" title="Monter" style="padding:0 4px;" disabled>↑</button>
                    <button id="btn-move-down" title="Descendre" style="padding:0 4px;" disabled>↓</button>
                    <button id="btn-link" title="Lier" style="padding:0 4px;" disabled>🔗</button>
                    <button id="btn-unlink" title="Délier" style="padding:0 4px;" disabled>⛓️‍💥</button>
                    <button id="btn-filter" title="Filtrer" style="padding:0 4px;">🔽</button>
                    <button id="btn-columns" title="Colonnes" style="padding:0 4px;">⚙️</button>
                </div>
            </div>
            <div class="pane-content" id="wbs-content">
                <!-- WBS Table will go here -->
            </div>
        </div>
        
        <!-- Splitter (T038) -->
        <div id="splitter"></div>

        <!-- Right Pane: Gantt Timeline -->
        <div id="right-pane">
            <div class="pane-header">
                <button id="btn-toggle-pane" title="Masquer / Afficher le WBS" style="padding:0 4px; margin-right: 8px;">◀</button>
                <span>Diagramme de Gantt</span>
            </div>
            <div class="pane-content" id="gantt-content">
                <!-- SVG Gantt Chart will go here -->
            </div>
        </div>
    </div>

    <script>
        // T004: Theme Toggle Logic (UI-004)
        const themeToggleBtn = document.getElementById('btn-theme-toggle');
        const html = document.documentElement;
        
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            themeToggleBtn.textContent = newTheme === 'light' ? 'Mode Sombre' : 'Mode Clair';
        });

        // T005: State Manager (Gestionnaire d'État XML)
        class ProjectState {
            constructor() {
                this.xmlDoc = null;
                this.fileHandle = null;
                this.listeners = [];
                this.hasUnsavedChanges = false;
                window.selectedTaskIds = new Set(); // T029: État de sélection global
                window.lastSelectedTaskId = null; // T029: Shift-click
            }

            // Charge la chaîne XML dans le DOM natif du navigateur
            loadXML(xmlString) {
                const parser = new DOMParser();
                this.xmlDoc = parser.parseFromString(xmlString, "application/xml");
                
                const parseError = this.xmlDoc.querySelector('parsererror');
                if (parseError) {
                    throw new Error("Erreur de parsing XML : " + parseError.textContent);
                }
                this.hasUnsavedChanges = false; // Réinitialise sur nouveau chargement
                window.selectedTaskIds.clear();
                window.lastSelectedTaskId = null;
                this.notifyListeners(true);
            }

            // Sérialise le DOM interne en chaîne XML
            getXMLString() {
                if (!this.xmlDoc) return "";
                const serializer = new XMLSerializer();
                return serializer.serializeToString(this.xmlDoc);
            }

            // Abonnements pour réactivité UI
            subscribe(callback) {
                this.listeners.push(callback);
            }

            // T046: Calcul automatique des dates des tâches parentes
            recomputeParentDates() {
                if (!this.xmlDoc) return;
                
                function processTaskNode(taskNode) {
                    const children = Array.from(taskNode.childNodes).filter(n => n.nodeType === 1 && n.nodeName === 'task');
                    
                    if (children.length === 0) {
                        taskNode.setAttribute('project', 'false');
                        return;
                    }
                    
                    taskNode.setAttribute('project', 'true');
                    
                    let minStart = Infinity;
                    let maxEnd = -Infinity;
                    let hasValidChildren = false;
                    
                    children.forEach(child => {
                        processTaskNode(child);
                        
                        const startStr = child.getAttribute('start');
                        const durStr = child.getAttribute('duration');
                        if (startStr && durStr) {
                            const d = new Date(startStr);
                            const dur = parseInt(durStr);
                            if (!isNaN(d) && !isNaN(dur)) {
                                const endMs = d.getTime() + dur * 24 * 60 * 60 * 1000;
                                if (d.getTime() < minStart) minStart = d.getTime();
                                if (endMs > maxEnd) maxEnd = endMs;
                                hasValidChildren = true;
                            }
                        }
                    });
                    
                    if (hasValidChildren) {
                        const minDate = new Date(minStart);
                        const dur = Math.round((maxEnd - minStart) / (24 * 60 * 60 * 1000));
                        
                        const isoStr = minDate.toISOString().split('T')[0];
                        taskNode.setAttribute('start', isoStr);
                        taskNode.setAttribute('duration', dur.toString());
                    }
                }
                
                const rootTasks = Array.from(this.xmlDoc.querySelectorAll('tasks > task'));
                rootTasks.forEach(t => processTaskNode(t));
            }

            notifyListeners(isLoad = false) {
                this.recomputeParentDates();
                if (!isLoad) this.hasUnsavedChanges = true;
                this.listeners.forEach(cb => cb(this.xmlDoc));
            }
            
            // Helpers
            getTasks() {
                if (!this.xmlDoc) return [];
                return Array.from(this.xmlDoc.querySelectorAll('tasks > task'));
            }
        }

        const state = new ProjectState();

        // T007: Logique d'analyse de l'entité Tâche (Task Parsing)
        function getDirectChildTasks(parentNode) {
            const tasks = [];
            for (let child of parentNode.childNodes) {
                if (child.nodeType === 1 && child.nodeName === 'task') {
                    const task = {
                        node: child, // Pointeur direct vers le noeud XML
                        id: child.getAttribute('id'),
                        name: child.getAttribute('name') || 'Tâche sans nom',
                        start: child.getAttribute('start') || '',
                        duration: parseInt(child.getAttribute('duration') || '1'),
                        complete: parseInt(child.getAttribute('complete') || '0'),
                        isMilestone: child.getAttribute('meeting') === 'true',
                        isProject: child.getAttribute('project') === 'true',
                        isExpanded: child.getAttribute('expand') !== 'false', // T036 : true par défaut
                        subtasks: getDirectChildTasks(child), // Récursivité WBS
                        // T013: Analyse des dépendances (Successeurs)
                        depends: Array.from(child.childNodes)
                            .filter(n => n.nodeType === 1 && n.nodeName === 'depend')
                            .map(n => ({
                                id: n.getAttribute('id'),
                                type: n.getAttribute('type') || 'FS',
                                difference: parseInt(n.getAttribute('difference') || '0')
                            }))
                    };
                    tasks.push(task);
                }
            }
            return tasks;
        }

        // T008: Rendu du tableau WBS
        function renderWBS(tasks, container, depth = 0) {
            if (depth === 0) container.innerHTML = ''; // Clear à la racine
            
            tasks.forEach(task => {
                const row = document.createElement('div');
                row.setAttribute('data-task-id', task.id);
                row.style.display = 'flex';
                row.style.alignItems = 'center';
                row.style.borderBottom = '1px solid var(--border-color)';
                row.style.height = '32px';
                row.style.boxSizing = 'border-box';
                row.style.fontSize = '13px';
                row.style.cursor = 'pointer'; // T029
                row.style.userSelect = 'none'; // Empêcher la sélection de texte
                
                // T029 : Gestion du clic pour multisélection
                row.addEventListener('click', (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    
                    if (e.shiftKey && window.lastSelectedTaskId) {
                        // Vider la sélection de texte du navigateur (sécurité supplémentaire)
                        if (window.getSelection) window.getSelection().removeAllRanges();
                        const allRows = Array.from(document.querySelectorAll('#wbs-content > div'));
                        const allIds = allRows.map(r => r.getAttribute('data-task-id'));
                        
                        const idx1 = allIds.indexOf(window.lastSelectedTaskId);
                        const idx2 = allIds.indexOf(task.id);
                        
                        if (idx1 !== -1 && idx2 !== -1) {
                            const start = Math.min(idx1, idx2);
                            const end = Math.max(idx1, idx2);
                            
                            if (!e.ctrlKey && !e.metaKey) {
                                window.selectedTaskIds.clear();
                            }
                            
                            for (let i = start; i <= end; i++) {
                                window.selectedTaskIds.add(allIds[i]);
                            }
                        }
                    } else if (e.ctrlKey || e.metaKey) {
                        if (window.selectedTaskIds.has(task.id)) {
                            window.selectedTaskIds.delete(task.id);
                        } else {
                            window.selectedTaskIds.add(task.id);
                        }
                        window.lastSelectedTaskId = task.id;
                    } else {
                        window.selectedTaskIds.clear();
                        window.selectedTaskIds.add(task.id);
                        window.lastSelectedTaskId = task.id;
                    }
                    updateSelectionUI();
                });
                
                const nameCol = document.createElement('div');
                nameCol.style.flex = '1';
                nameCol.style.paddingLeft = (depth * 20 + 8) + 'px';
                nameCol.style.fontWeight = (task.isProject || task.subtasks.length > 0) ? 'bold' : 'normal';
                
                // Indicateur de jalon ou de projet
                let icon = '📄 ';
                if (task.isMilestone) icon = '🔷 ';
                if (task.isProject || task.subtasks.length > 0) icon = '📁 ';
                
                // T036 : Chevron pliable
                const chevronSpan = document.createElement('span');
                chevronSpan.style.display = 'inline-block';
                chevronSpan.style.width = '14px';
                chevronSpan.style.textAlign = 'center';
                chevronSpan.style.cursor = 'pointer';
                chevronSpan.style.marginRight = '4px';
                chevronSpan.style.userSelect = 'none';

                const hasChildren = task.subtasks.length > 0;
                const isFolded = !task.isExpanded;

                if (hasChildren) {
                    chevronSpan.textContent = isFolded ? '›' : 'v';
                    chevronSpan.addEventListener('click', (e) => {
                        e.stopPropagation(); // Évite de sélectionner la tâche
                        task.node.setAttribute('expand', isFolded ? 'true' : 'false');
                        state.notifyListeners();
                    });
                } else {
                    chevronSpan.textContent = ' ';
                }

                nameCol.appendChild(chevronSpan);
                nameCol.appendChild(document.createTextNode(icon + task.name));
                
                const durationCol = document.createElement('div');
                durationCol.style.width = '60px';
                durationCol.style.textAlign = 'right';
                durationCol.style.paddingRight = '8px';
                durationCol.textContent = task.isMilestone ? '0j' : task.duration + 'j';
                
                const startCol = document.createElement('div');
                startCol.style.width = '100px';
                startCol.textContent = task.start;
                
                // T010 : Suppression d'une tâche via un bouton
                const delBtn = document.createElement('button');
                delBtn.textContent = 'x';
                delBtn.style.padding = '0 6px';
                delBtn.style.marginRight = '2px';
                delBtn.style.fontSize = '10px';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = () => {
                    task.node.parentNode.removeChild(task.node);
                    state.notifyListeners(); // Force le re-rendu
                };

                // T015 : Bouton pour décaler la tâche de +1 jour (Décalage en cascade)
                const shiftBtn = document.createElement('button');
                shiftBtn.textContent = '→';
                shiftBtn.style.padding = '0 4px';
                shiftBtn.style.marginRight = '4px';
                shiftBtn.style.fontSize = '10px';
                shiftBtn.title = 'Décaler de +1 jour (Cascade)';
                shiftBtn.onclick = () => {
                    shiftTaskRecursive(task.id, 1);
                    state.notifyListeners();
                };

                // T018 : Affecter une ressource
                const assignBtn = document.createElement('button');
                assignBtn.textContent = '👤';
                assignBtn.style.padding = '0 4px';
                assignBtn.style.fontSize = '10px';
                assignBtn.title = 'Affecter une ressource';
                assignBtn.onclick = () => {
                    const res = getResources();
                    if (res.length === 0) return alert('Aucune ressource dans le pool. Créez-en d\'abord via le bouton Ressources.');
                    
                    const assignSelect = document.getElementById('assign-resource-select');
                    assignSelect.innerHTML = '';
                    res.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r.id;
                        opt.textContent = r.name;
                        assignSelect.appendChild(opt);
                    });
                    
                    window.currentAssignTaskId = task.id;
                    document.getElementById('assign-modal').showModal();
                };
                
                // T022 : Bouton pourcentage d'avancement
                const progBtn = document.createElement('button');
                progBtn.textContent = '%';
                progBtn.style.padding = '0 4px';
                progBtn.style.marginLeft = '4px';
                progBtn.style.fontSize = '10px';
                progBtn.title = 'Avancement (0-100%)';
                progBtn.onclick = () => {
                    const currentComp = task.complete || 0;
                    const val = prompt("Pourcentage d'avancement (0-100) :", currentComp);
                    if (val !== null) {
                        const parsed = parseInt(val);
                        if (!isNaN(parsed) && parsed >= 0 && parsed <= 100) {
                            task.node.setAttribute('complete', parsed);
                            state.notifyListeners();
                        } else {
                            alert("Veuillez entrer un nombre entre 0 et 100.");
                        }
                    }
                };
                
                const actionCol = document.createElement('div');
                actionCol.style.width = '95px';
                actionCol.appendChild(delBtn);
                actionCol.appendChild(shiftBtn);
                actionCol.appendChild(assignBtn);
                actionCol.appendChild(progBtn);

                row.appendChild(actionCol);
                row.appendChild(nameCol);
                row.appendChild(durationCol);
                row.appendChild(startCol);
                container.appendChild(row);
                
                // Rendu récursif des sous-tâches
                if (task.isExpanded) {
                    renderWBS(task.subtasks, container, depth + 1);
                }
            });
        }

        // T009: Rendu du diagramme de Gantt
        function renderGantt(tasks, container) {
            container.innerHTML = '';
            if (tasks.length === 0) return;
            
            // Aplatir les tâches pour aligner sur le WBS
            const flatTasks = [];
            function flatten(tList) {
                tList.forEach(t => {
                    flatTasks.push(t);
                    if (t.isExpanded) {
                        flatten(t.subtasks);
                    }
                });
            }
            flatten(tasks);
            
            // Trouver la date minimale (début du projet)
            let minDate = new Date("2100-01-01");
            let hasValidDates = false;
            flatTasks.forEach(t => {
                if (t.start) {
                    const d = new Date(t.start);
                    if (!isNaN(d) && d < minDate) {
                        minDate = d;
                        hasValidDates = true;
                    }
                }
            });
            if (!hasValidDates) minDate = new Date();
            
            const rowHeight = 32; // Hauteur EXACTE de la ligne WBS
            const dayWidth = 20; // 20px par jour
            const totalHeight = flatTasks.length * rowHeight;
            const totalWidth = 3000; // Zone déroulable large
            
            // T019 & T020 : Ressources et Lignes de base
            const resources = getResources();
            const allocations = getAllocations();
            const baselines = getBaselines();
            const activeBaseline = window.activeBaselineName ? baselines.find(b => b.name === window.activeBaselineName) : null;

            // Création SVG dynamique
            let svg = `<svg width="${totalWidth}" height="${Math.max(totalHeight, 100)}" xmlns="http://www.w3.org/2000/svg">`;
            
            // Définition de la flèche pour les dépendances
            svg += `<defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935" />
                </marker>
            </defs>`;
            
            // Lignes d'arrière plan (grille)
            for(let i=0; i<flatTasks.length; i++) {
                svg += `<line x1="0" y1="${i*rowHeight + rowHeight}" x2="${totalWidth}" y2="${i*rowHeight + rowHeight}" stroke="var(--border-color)" stroke-width="1" />`;
            }

            const coordMap = {}; // T014: Cartographie des coordonnées

            flatTasks.forEach((t, i) => {
                if (!t.start) return;
                const startDate = new Date(t.start);
                if (isNaN(startDate)) return;
                
                const daysDiff = (startDate - minDate) / (1000 * 60 * 60 * 24);
                
                const x = Math.max(daysDiff * dayWidth, 10);
                const y = i * rowHeight + 8; // Centrage vertical
                const w = Math.max(t.duration * dayWidth, 4);
                const h = rowHeight - 16;
                
                // Mémorisation pour les flèches
                coordMap[t.id] = { xStart: x, xEnd: x + w, yMid: y + h/2 };
                
                let color = 'var(--primary-color)'; // Tâche standard
                if (t.isMilestone) color = '#ff9800'; // Jalon orange
                else if (t.isProject || t.subtasks.length > 0) color = '#8cb6ce'; // Tâche parente / Projet
                
                if (t.isMilestone) {
                     // T011 : Affichage graphique des jalons (Losange)
                     const cx = x + 10;
                     const cy = y + h/2;
                     const r = 8;
                     svg += `<polygon class="gantt-item" data-task-id="${t.id}" points="${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}" fill="${color}" stroke="#e68a00" stroke-width="1"/>`;
                } else {
                     // Barre de tâche rectangulaire
                     svg += `<rect class="gantt-item" data-task-id="${t.id}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${color}" stroke="#00000033" stroke-width="1"/>`;
                     // Affichage de la complétion (T023)
                     if (t.complete > 0) {
                         const compW = w * (t.complete / 100);
                         svg += `<rect x="${x}" y="${y+(h/4)}" width="${compW}" height="${h/2}" fill="#000" opacity="0.3" rx="1"/>`;
                     }
                }
                
                // T021 : Rendu de la ligne de base
                if (activeBaseline) {
                    const bTask = activeBaseline.tasks.find(bt => bt.id === t.id);
                    if (bTask && bTask.start) {
                        const bStartDate = new Date(bTask.start);
                        if (!isNaN(bStartDate)) {
                            const bDaysDiff = (bStartDate - minDate) / (1000 * 60 * 60 * 24);
                            const bx = Math.max(bDaysDiff * dayWidth, 10);
                            const bw = Math.max(bTask.duration * dayWidth, 4);
                            svg += `<rect x="${bx}" y="${y + h - 4}" width="${bw}" height="6" fill="#888888" opacity="0.6" rx="2" title="Ligne de base"/>`;
                        }
                    }
                }
                
                // T019 : Afficher la ressource assignée à côté de la tâche
                const taskAllocs = allocations.filter(a => a.taskId === t.id);
                if (taskAllocs.length > 0) {
                    const resNames = taskAllocs.map(a => {
                        const r = resources.find(res => res.id === a.resourceId);
                        return r ? r.name : 'Inconnu';
                    }).join(', ');
                    
                    svg += `<text x="${x + w + 10}" y="${y + h/2 + 4}" font-size="11" fill="var(--text-color)">👤 ${resNames}</text>`;
                }
            });
            
            // T014: Tracer les liens de dépendances
            flatTasks.forEach(t => {
                const source = coordMap[t.id];
                if (!source) return;
                
                t.depends.forEach(dep => {
                    const target = coordMap[dep.id];
                    if (!target) return;
                    
                    let x1 = source.xEnd;
                    let y1 = source.yMid;
                    let x2 = target.xStart;
                    let y2 = target.yMid;
                    
                    if (dep.type === 'FF') { x1 = source.xEnd; x2 = target.xEnd; }
                    else if (dep.type === 'SS') { x1 = source.xStart; x2 = target.xStart; }
                    else if (dep.type === 'SF') { x1 = source.xStart; x2 = target.xEnd; }
                    
                    // Tracé orthogonal
                    const path = `M ${x1} ${y1} L ${x1+5} ${y1} L ${x1+5} ${y2} L ${x2-8} ${y2}`;
                    svg += `<path d="${path}" fill="none" stroke="#e53935" stroke-width="1.5" marker-end="url(#arrow)"/>`;
                });
            });
            
            svg += `</svg>`;
            container.innerHTML = svg;
            
            updateSelectionUI(); // Rafraîchissement post-rendu
        }

        // T030 & T031 : Boutons hiérarchie WBS
        function getPrevTask(node) {
            let n = node.previousElementSibling;
            while(n && n.tagName !== 'task') n = n.previousElementSibling;
            return n;
        }
        function getNextTask(node) {
            let n = node.nextElementSibling;
            while(n && n.tagName !== 'task') n = n.nextElementSibling;
            return n;
        }

        function updateToolbarButtons() {
            const btnIndent = document.getElementById('btn-indent');
            const btnOutdent = document.getElementById('btn-outdent');
            const btnUp = document.getElementById('btn-move-up');
            const btnDown = document.getElementById('btn-move-down');
            const btnLink = document.getElementById('btn-link');
            const btnUnlink = document.getElementById('btn-unlink');
            
            const selected = Array.from(window.selectedTaskIds);
            const nodes = selected.map(id => state.xmlDoc.querySelector(`task[id="${id}"]`)).filter(n => n);
            
            if (nodes.length === 0) {
                btnIndent.disabled = true;
                btnOutdent.disabled = true;
                btnUp.disabled = true;
                btnDown.disabled = true;
                btnLink.disabled = true;
                btnUnlink.disabled = true;
                return;
            }

            const parentNodes = new Set(nodes.map(n => n.parentNode));
            const hasSameParent = (parentNodes.size === 1);
            
            if (nodes.length === 1) {
                const taskNode = nodes[0];
                btnIndent.disabled = !getPrevTask(taskNode);
                btnOutdent.disabled = (taskNode.parentNode.tagName !== 'task');
                btnUp.disabled = !getPrevTask(taskNode);
                btnDown.disabled = !getNextTask(taskNode);
            } else {
                if (hasSameParent) {
                    const canAllIndent = nodes.every(n => getPrevTask(n) !== null);
                    const canAllOutdent = nodes.every(n => n.parentNode.tagName === 'task');
                    const canAllMoveUp = nodes.every(n => getPrevTask(n) !== null);
                    const canAllMoveDown = nodes.every(n => getNextTask(n) !== null);
                    
                    btnIndent.disabled = !canAllIndent;
                    btnOutdent.disabled = !canAllOutdent;
                    btnUp.disabled = !canAllMoveUp;
                    btnDown.disabled = !canAllMoveDown;
                } else {
                    btnIndent.disabled = true;
                    btnOutdent.disabled = true;
                    btnUp.disabled = true;
                    btnDown.disabled = true;
                }
            }
            
            if (nodes.length >= 2) {
                btnLink.disabled = false;
                
                let hasLinks = false;
                for (const source of nodes) {
                    for (const target of nodes) {
                        if (source === target) continue;
                        const targetId = target.getAttribute('id');
                        const dep = Array.from(source.childNodes).find(n => n.nodeType === 1 && n.nodeName === 'depend' && n.getAttribute('id') === targetId);
                        if (dep) {
                            hasLinks = true;
                            break;
                        }
                    }
                    if (hasLinks) break;
                }
                btnUnlink.disabled = !hasLinks;
            } else {
                btnLink.disabled = true;
                btnUnlink.disabled = true;
            }
        }

        // Événements d'indentation / déplacement
        document.getElementById('btn-indent').addEventListener('click', () => {
            const selectedIds = Array.from(window.selectedTaskIds);
            const nodes = selectedIds.map(id => state.xmlDoc.querySelector(`task[id="${id}"]`)).filter(n => n);
            
            nodes.sort((a, b) => {
                return (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
            });
            
            let moved = false;
            nodes.forEach(node => {
                const prev = getPrevTask(node);
                if (prev) {
                    prev.appendChild(node);
                    moved = true;
                }
            });
            if (moved) state.notifyListeners();
        });

        document.getElementById('btn-outdent').addEventListener('click', () => {
            const selectedIds = Array.from(window.selectedTaskIds);
            const nodes = selectedIds.map(id => state.xmlDoc.querySelector(`task[id="${id}"]`)).filter(n => n);
            
            nodes.sort((a, b) => {
                return (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? 1 : -1;
            });
            
            let moved = false;
            nodes.forEach(node => {
                const parent = node.parentNode;
                if (parent && parent.tagName === 'task') {
                    parent.parentNode.insertBefore(node, parent.nextElementSibling);
                    moved = true;
                }
            });
            if (moved) state.notifyListeners();
        });

        document.getElementById('btn-move-up').addEventListener('click', () => {
            const selectedIds = Array.from(window.selectedTaskIds);
            const nodes = selectedIds.map(id => state.xmlDoc.querySelector(`task[id="${id}"]`)).filter(n => n);
            
            nodes.sort((a, b) => {
                return (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
            });
            
            let moved = false;
            nodes.forEach(node => {
                const prev = getPrevTask(node);
                if (prev) {
                    node.parentNode.insertBefore(node, prev);
                    moved = true;
                }
            });
            if (moved) state.notifyListeners();

        document.getElementById('btn-move-down').addEventListener('click', () => {
            const selectedIds = Array.from(window.selectedTaskIds);

            nodes.sort((a, b) => {
                return (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? 1 : -1;
            });
            
            let moved = false;
            nodes.forEach(node => {
                const next = getNextTask(node);
                if (next) {
                    node.parentNode.insertBefore(next, node);
                    moved = true;
                }
            });
            if (moved) state.notifyListeners();
        });

        // T032 : Boutons Lier et Délier
        document.getElementById('btn-link').addEventListener('click', () => {
            const selectedIds = Array.from(window.selectedTaskIds);
            const nodes = selectedIds.map(id => state.xmlDoc.querySelector(`task[id="${id}"]`)).filter(n => n);
            
            if (nodes.length < 2) return;
            
            nodes.sort((a, b) => {
                return (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
            });
            
            let changed = false;
            for (let i = 0; i < nodes.length - 1; i++) {
                const source = nodes[i];
                const target = nodes[i+1];
                const targetId = target.getAttribute('id');
                
                const existing = Array.from(source.childNodes).find(n => n.nodeType === 1 && n.nodeName === 'depend' && n.getAttribute('id') === targetId);
                if (!existing) {
                    const depend = state.xmlDoc.createElement('depend');
                    depend.setAttribute('id', targetId);
                    depend.setAttribute('type', 'FS');
                    depend.setAttribute('difference', '0');
                    depend.setAttribute('hardness', 'Strong');
                    
                    const firstTask = Array.from(source.childNodes).find(n => n.nodeType === 1 && n.nodeName === 'task');
                    if (firstTask) {
                        source.insertBefore(depend, firstTask);
                    } else {
                        source.appendChild(depend);
                    }
                    changed = true;
                }
            }
            if (changed) state.notifyListeners();
        });

        document.getElementById('btn-unlink').addEventListener('click', () => {
            const selectedIds = Array.from(window.selectedTaskIds);
            const nodes = selectedIds.map(id => state.xmlDoc.querySelector(`task[id="${id}"]`)).filter(n => n);
            
            if (nodes.length < 2) return;
            
            let changed = false;
            nodes.forEach(source => {
                nodes.forEach(target => {
                    if (source === target) return;
                    const targetId = target.getAttribute('id');
                    const deps = Array.from(source.childNodes).filter(n => n.nodeType === 1 && n.nodeName === 'depend' && n.getAttribute('id') === targetId);
                    deps.forEach(dep => {
                        source.removeChild(dep);
                        changed = true;
                    });
                });
            });
            if (changed) state.notifyListeners();

        // T010 / T011: Logique de création de tâches et jalons
        function createNewTask(isMilestone = false) {
            if (!state.xmlDoc) return alert("Veuillez d'abord ouvrir ou initialiser un projet !");
            
            
            let tasksNode = state.xmlDoc.querySelector('tasks');
            if (!tasksNode) {
                // Si la racine <tasks> n'existe pas, la créer (pour les nouveaux projets vides)
                tasksNode = state.xmlDoc.createElement('tasks');
                state.xmlDoc.documentElement.appendChild(tasksNode);
            }
            
            const newTask = state.xmlDoc.createElement('task');
            const newId = Math.floor(Math.random() * 100000).toString();
            newTask.setAttribute('id', newId);
            newTask.setAttribute('name', isMilestone ? 'Nouveau Jalon' : 'Nouvelle Tâche');
            
            // On met la date d'aujourd'hui par défaut
            const today = new Date().toISOString().split('T')[0];
            newTask.setAttribute('start', today);
            
            newTask.setAttribute('duration', isMilestone ? '0' : '1');
            newTask.setAttribute('meeting', isMilestone ? 'true' : 'false');
            
            // T035 : Insertion sous la sélection courante
            const selectedIds = Array.from(window.selectedTaskIds);
            let inserted = false;
            if (selectedIds.length > 0) {
                const lastSelectedNode = state.xmlDoc.querySelector(`task[id="${selectedIds[selectedIds.length - 1]}"]`);
                if (lastSelectedNode && lastSelectedNode.parentNode) {
                    lastSelectedNode.parentNode.insertBefore(newTask, lastSelectedNode.nextElementSibling);
                    inserted = true;
                }
            }
            if (!inserted) {
                tasksNode.appendChild(newTask);
            }
            
            window.selectedTaskIds.clear();
            window.selectedTaskIds.add(newId);
            state.notifyListeners();
        }

        document.getElementById('btn-add-milestone').addEventListener('click', () => createNewTask(true));

        // T015: Logique de décalage automatique en cascade (Cascade Shifting)
        function shiftTaskRecursive(taskId, days, visited = new Set()) {
            if (visited.has(taskId)) return; // Évite les boucles infinies (dépendances circulaires)
            visited.add(taskId);
            
            const taskNode = state.xmlDoc.querySelector(`task[id="${taskId}"]`);
            if (!taskNode) return;
            
            const startStr = taskNode.getAttribute('start');
            if (startStr) {
                const date = new Date(startStr);
                date.setDate(date.getDate() + days);
                taskNode.setAttribute('start', date.toISOString().split('T')[0]);
            }
            
            // Trouver les successeurs directs
            for (let child of taskNode.childNodes) {
                if (child.nodeType === 1 && child.nodeName === 'depend') {
                    const succId = child.getAttribute('id');
                    shiftTaskRecursive(succId, days, visited);
                }
            }
        }

                        excludeAcceptAllOption: true,
                        multiple: false
                    });
                    
                    const file = await fileHandle.getFile();
                    const contents = await file.text();
                    
                    state.loadXML(contents);
                    state.fileHandle = fileHandle;
                    document.getElementById('btn-save').style.display = 'inline-block';
                    console.log("Projet chargé avec succès ! (File System Access API)");
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error("Erreur d'ouverture :", err);
                        alert("Erreur lors de l'ouverture du fichier : " + err.message);
                    }
                }
            } else {
                // Fallback pour Firefox ou environnement sans API File System (ex: protocole file:// strict)
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.gan,application/xml';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) {
                        document.body.removeChild(input);
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            state.loadXML(event.target.result);
                            state.fileHandle = { name: file.name, fallback: true };
                            document.getElementById('btn-save').style.display = 'none';
                            console.log("Projet chargé avec succès ! (Fallback input file)");
                        } catch (err) {
                            console.error("Erreur de parsing :", err);
                            alert("Erreur lors de l'analyse du fichier XML : " + err.message);
                        }
                        document.body.removeChild(input);
                    };
                    reader.readAsText(file);
                };
                input.click();
            }
        });

        btnSave.addEventListener('click', async () => {
            if (!state.xmlDoc) {
                alert("Aucun projet n'est actuellement ouvert.");
                return;
            }
            if (!state.hasUnsavedChanges) {
                console.log("Aucune modification à sauvegarder.");
                return;
            }
            
            const xmlContent = state.getXMLString();
            const finalXml = xmlContent.startsWith('<?xml') 
                ? xmlContent 
                : '<?xml version="1.0" encoding="UTF-8"?>\n' + xmlContent;
                
            if (window.showSaveFilePicker && state.fileHandle && !state.fileHandle.fallback) {
                try {
                    // Écrase le fichier original sans ouvrir de dialogue "Enregistrer sous"
                    const writable = await state.fileHandle.createWritable();
                    await writable.write(finalXml);
                    await writable.close();
                    
                    state.hasUnsavedChanges = false;
                    console.log("Projet écrasé avec succès ! (File System Access API)");
                } catch (err) {
                    console.error("Erreur de sauvegarde :", err);
                    alert("Erreur lors de la sauvegarde : " + err.message);
                }
            } else {
                alert("Votre navigateur ou votre environnement actuel ne permet pas d'écraser directement le fichier source. Veuillez utiliser le bouton 'Télécharger'.");
            }
        });

        document.getElementById('btn-download').addEventListener('click', async () => {
            if (!state.xmlDoc) {
                alert("Aucun projet n'est actuellement ouvert.");
                return;
            }
            
            const xmlContent = state.getXMLString();
            const finalXml = xmlContent.startsWith('<?xml') 
                ? xmlContent 
                : '<?xml version="1.0" encoding="UTF-8"?>\n' + xmlContent;
                
            if (window.showSaveFilePicker) {
                try {
                    const fileHandle = await window.showSaveFilePicker({
                        suggestedName: (state.fileHandle && state.fileHandle.name) ? state.fileHandle.name : 'nouveau_projet.gan',
                        types: [{
                            description: 'Fichiers GanttProject (.gan)',
                            accept: {'application/xml': ['.gan']}
                        }]
                    });
                    
                    const writable = await fileHandle.createWritable();
                    await writable.write(finalXml);
                    await writable.close();
                    
                    state.fileHandle = fileHandle;
                    state.hasUnsavedChanges = false;
                    console.log("Projet téléchargé avec succès ! (File System Access API)");
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error("Erreur de téléchargement :", err);
                        alert("Erreur lors du téléchargement : " + err.message);
                    }
                }
            } else {
                // Fallback pour la sauvegarde via Blob et lien de téléchargement
                const blob = new Blob([finalXml], { type: 'application/xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (state.fileHandle && state.fileHandle.name) ? state.fileHandle.name : 'nouveau_projet.gan';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                state.hasUnsavedChanges = false;
                console.log("Projet téléchargé avec succès ! (Fallback de téléchargement)");
            }
        });

        // Avertissement de modifications non sauvegardées à la fermeture
        window.addEventListener('beforeunload', (e) => {
            if (state.hasUnsavedChanges) {
                e.preventDefault();
                e.returnValue = "Vous avez des modifications non enregistrées. Voulez-vous vraiment quitter ?";
            }
        });
    </script>
</body>
</html>
